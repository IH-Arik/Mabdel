name: Deploy to production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # PROD_SSH_KEY is base64-encoded on purpose — pasting a raw multi-line PEM key
      # into GitHub's secret box is fragile (terminal line-wrapping when copying it
      # tends to corrupt it, which is silent until ssh-action fails to parse it at
      # deploy time). Decoding it here, in-workflow, means a human never has to
      # correctly copy-paste the multi-line key at all. appleboy/ssh-action runs in
      # its own Docker container that doesn't mount the runner's /tmp, so the
      # decoded key is passed as content via a step output, not a file path.
      - name: Decode SSH key
        id: decode
        run: |
          DECODED=$(echo "${{ secrets.PROD_SSH_KEY }}" | base64 -d)
          echo "ssh_key<<SSHKEY_EOF" >> "$GITHUB_OUTPUT"
          echo "$DECODED" >> "$GITHUB_OUTPUT"
          echo "SSHKEY_EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ steps.decode.outputs.ssh_key }}
          script: |
            set -e
            cd /home/ubuntu/Mabdel
            git pull origin master
            cd "Mabdel Backend"
            sudo docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ steps.decode.outputs.ssh_key }}
          script: |
            sleep 10
            curl -sf https://api.gocustify.com/health
