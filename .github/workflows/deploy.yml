name: Deploy to production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and rebuild
        run: |
          set -e
          echo "whoami: $(whoami)"
          echo "pwd before cd: $(pwd)"
          cd /home/ubuntu/Mabdel
          echo "pwd after cd: $(pwd)"
          ls -la .git || echo ".git NOT FOUND HERE"
          git pull origin master
          cd "Mabdel Backend"
          sudo docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify health
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://api.gocustify.com/health; then exit 0; fi
            sleep 5
          done
          echo "Backend did not become healthy within 60s"
          exit 1

      - name: Sync legal/content pages into DB
        run: |
          set -e
          sudo docker exec mabdel-backend-api python -m scripts.sync_legal_content

      - name: Build and deploy website
        run: |
          set -e
          cd /home/ubuntu/Mabdel/"Mabdel Website"
          npm install
          npm run build
          rsync -a dist/ /var/www/gocustify/
