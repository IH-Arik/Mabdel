name: Deploy to production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and rebuild
        run: |
          set -e
          echo "whoami: $(whoami)"
          echo "pwd before cd: $(pwd)"
          cd /home/ubuntu/Mabdel
          echo "pwd after cd: $(pwd)"
          ls -la .git || echo ".git NOT FOUND HERE"
          git pull origin master
          cd "Mabdel Backend"
          sudo docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify health
        run: |
          sleep 10
          curl -sf https://api.gocustify.com/health
