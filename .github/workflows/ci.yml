name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mabdel Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Mabdel Backend/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest app/tests -q

  website:
    name: Website (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mabdel Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Mabdel Website/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:bundle-size

  dashboard:
    name: Admin Dashboard (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: madbel-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "madbel-dashboard/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Only runs after backend/website/dashboard all pass - previously this lived
  # in a separate deploy.yml that triggered independently on the same push
  # event, so a commit that failed lint/tests/build still deployed to
  # production; CI passing or failing had no effect on it at all.
  deploy:
    name: Deploy to production
    needs: [backend, website, dashboard]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Pull and rebuild
        run: |
          set -e
          cd /home/ubuntu/Mabdel
          # Reset to the exact commit this workflow run tested (github.sha), not
          # origin/master's current tip - a later push landing on master between
          # this run starting and the deploy job executing would otherwise deploy
          # an untested commit under a "passed" CI run that never actually tested it.
          git fetch origin "${{ github.sha }}"
          git reset --hard "${{ github.sha }}"
          git log --oneline -1
          cd "Mabdel Backend"
          sudo docker compose -f docker-compose.prod.yml up -d --build

      - name: Verify readiness
        run: |
          # /health is a pure liveness probe - it returns 200 once the process
          # starts regardless of whether the database is actually reachable, so
          # checking it here could pass a deploy whose backend can't talk to
          # Mongo at all. /ready reports the real dependency state.
          for i in $(seq 1 12); do
            if curl -sf https://api.gocustify.com/ready; then exit 0; fi
            sleep 5
          done
          echo "Backend did not become ready within 60s"
          exit 1

      - name: Sync legal/content pages into DB
        run: |
          set -e
          sudo docker exec mabdel-backend-api python -m scripts.sync_legal_content

      - name: Build and deploy website
        run: |
          set -e
          cd /home/ubuntu/Mabdel/"Mabdel Website"
          npm install
          npm run build
          rsync -a dist/ /var/www/gocustify/
